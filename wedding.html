<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  color:#28231f;
  font-family:"Montserrat",sans-serif;
  background:transparent;
}

img{display:block;max-width:100%}

.container{
  width:min(1050px,88%);
  margin:auto;
}

nav{
  padding:28px 5%;
  display:flex;
  justify-content:center;
  gap:35px;
}

nav a{
  color:#28231f;
  text-decoration:none;
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:9px;
}

.header{
  padding:80px 20px 60px;
  text-align:center;
}

.label{
  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;
}

h1,h2{
  font-family:"Cormorant Garamond",serif;
  font-style:italic;
  font-weight:400;
}

h1{
  font-size:clamp(60px,8vw,90px);
}

h2{font-size:50px}

.line{
  width:45px;
  height:1px;
  background:#b7a17e;
  margin:25px auto;
}

.subtitle{
  font-family:"Cormorant Garamond",serif;
  font-size:20px;
}

.feature{
  text-align:center;
}

.feature img{
  width:auto;
  max-width:100%;
  max-height:650px;
  margin:auto;
  object-fit:contain;
}

.details{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:50px;
  text-align:center;
  padding:70px 0;
}

.details span{
  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;
}

.details p{
  margin-top:10px;
  font-family:"Cormorant Garamond",serif;
  font-size:20px;
  line-height:1.5;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.gallery div{
  height:330px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.stationery{
  padding:100px 0 40px;
  text-align:center;
}

.stationery-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  align-items:center;
}

.stationery-grid img{
  width:100%;
  height:auto;
  max-height:400px;
  object-fit:contain;
}

.next{
  padding:100px 20px;
  text-align:center;
}

.next a{
  color:#28231f;
  text-decoration:none;
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
  border-bottom:1px solid #b7a17e;
  padding-bottom:8px;
}

@media(max-width:700px){
  nav{gap:18px}

  .details{
    grid-template-columns:1fr;
    gap:35px;
  }

  .gallery{
    grid-template-columns:1fr;
  }

  .gallery div{
    height:auto;
  }

  .gallery img{
    height:auto;
    max-height:500px;
    object-fit:contain;
  }

  .stationery-grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
